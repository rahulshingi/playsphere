[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = False
show_error_codes = True
pretty = True
ignore_missing_imports = True

# Strict typing only on shared helpers of our newly refactored modules —
# FastAPI route handlers themselves stay lenient (their signatures already
# encode types via annotations + Pydantic, and the return payloads are dicts
# validated by response models where declared).

[mypy-routes.cs_invoices]
check_untyped_defs = True

[mypy-routes.corporate_services]
check_untyped_defs = True

[mypy-routes.sitemap]
check_untyped_defs = True

[mypy-routes.players_corp_email]
check_untyped_defs = True
